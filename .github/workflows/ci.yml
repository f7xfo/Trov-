name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trov
          POSTGRES_PASSWORD: trov
          POSTGRES_DB: trov
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://trov:trov@localhost:5432/trov
        run: alembic upgrade head

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://trov:trov@localhost:5432/trov
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
